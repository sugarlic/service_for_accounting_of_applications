services:
  postgres:
    image: postgres:16-alpine
    container_name: applications-postgres
    environment:
      POSTGRES_DB: application_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d application_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: application-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/application_service?sslmode=disable
      CRM_API_KEY: test-api-key
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: